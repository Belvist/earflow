<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Earflow — обновляемся</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background: #0a0a0a;
      color: rgba(255, 255, 255, 0.92);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 40px 28px 36px;
      border-radius: 20px;
      background: linear-gradient(165deg, rgba(32, 32, 32, 0.9) 0%, rgba(12, 12, 12, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }
    .mark {
      font-weight: 800;
      font-size: clamp(1.5rem, 5vw, 1.75rem);
      letter-spacing: -0.04em;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff 0%, rgba(255, 255, 255, 0.75) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-weight: 600;
      font-size: 1.05rem;
      margin: 0 0 10px;
      line-height: 1.4;
    }
    p {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.55;
    }
    .pulse {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 28px 0 8px;
    }
    .pulse span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: p 1.2s ease-in-out infinite;
    }
    .pulse span:nth-child(2) { animation-delay: 0.15s; }
    .pulse span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes p {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <div class="mark">earflow</div>
    <h1>Мы сейчас на небольшом перерыве</h1>
    <p>Обновляем сервис. Зайдите через минуту — обычно хватает одного кофе.</p>
    <div class="pulse" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>
