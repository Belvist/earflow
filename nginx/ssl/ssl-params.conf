# =============================================================================
# SSL Security Parameters - Modern Configuration (2024)
# Based on Mozilla SSL Configuration Generator - Intermediate compatibility
# https://ssl-config.mozilla.org/
# =============================================================================

# Protocol versions - only TLS 1.2 and 1.3 (TLS 1.0/1.1 deprecated)
ssl_protocols TLSv1.2 TLSv1.3;

# Cipher suites - prioritize AEAD ciphers
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

# Server cipher preference (let client choose for TLS 1.3 compatibility)
ssl_prefer_server_ciphers off;

# DH parameters (generate with: openssl dhparam -out dhparam.pem 4096)
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# ECDH curve
ssl_ecdh_curve secp384r1;

# Session caching - shared across workers
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling - reduces latency and improves privacy
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Buffer size optimization for small files
ssl_buffer_size 4k;

# Early data (0-RTT) - disabled for security (replay attacks)
ssl_early_data off;
