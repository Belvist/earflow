# Подключается в server { } для earflow / auth / artists: красивая 503
# при 502/503/504 от фронтенда (докер пересобирается, upstream недоступен).
# Не влияет на location /api/ — там proxy_intercept_errors по умолчанию off.

error_page 502 503 504 =503 /maintenance.html;

location = /maintenance.html {
    internal;
    root /usr/share/nginx/html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Retry-After "60" always;
}
