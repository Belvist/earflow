# PEND-SEC-001: single-origin edge for auth full-stack e2e (SPA + API).
# Mounted by auth-e2e-edge service in docker-compose.auth-e2e.yml.
#
# Docker DNS: static proxy_pass hostnames are resolved once at nginx start.
# After api-gateway recreate (capacity SKIP_STACK), stale IPs → 502 until edge reload.
# Use 127.0.0.11 resolver + variable upstream so DNS re-resolves on each request.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $api_upstream api-gateway:3000;
        proxy_http_version 1.1;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        set $fe_upstream frontend:3004;
        proxy_http_version 1.1;
        proxy_pass http://$fe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
