# Log formats shared by all virtual hosts.
log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" rt=$request_time '
                'uct=$upstream_connect_time uht=$upstream_header_time '
                'urt=$upstream_response_time upstream=$upstream_addr';

log_format hls_main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "-" '
                    '"$http_user_agent" rt=$request_time '
                    'uct=$upstream_connect_time uht=$upstream_header_time '
                    'urt=$upstream_response_time upstream=$upstream_addr';

log_format security '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status "$http_referer" "$http_user_agent" '
                    'body_bytes=$body_bytes_sent request_length=$request_length';

log_format media_json escape=json '{'
                    '"ts":"$time_iso8601",'
                    '"level":"$log_level",'
                    '"event":"media_request",'
                    '"service":"nginx",'
                    '"status":$status,'
                    '"method":"$request_method",'
                    '"uri":"$uri",'
                    '"host":"$host",'
                    '"origin":"$http_origin",'
                    '"range":"$http_range",'
                    '"referer":"$http_referer",'
                    '"rt":$request_time,'
                    '"upstream":"$upstream_addr",'
                    '"upstream_status":"$upstream_status",'
                    '"cache":"$upstream_cache_status"'
                '}';
