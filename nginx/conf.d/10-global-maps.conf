# Global variable maps used by multiple sites.
map $status $log_level {
    ~^[23] "info";
    ~^4 "warn";
    ~^5 "error";
    default "info";
}

map $http_upgrade $connection_upgrade {
    default "";
    ~*websocket "upgrade";
}

map $http_origin $cors_artists_origin {
    default "";
    ~^https?://artists\.earflow\.ru$ $http_origin;
}

# PoP (PEND-SEC-001): shared CORS Allow-Headers for authenticated cross-origin API.
map $host $earflow_cors_auth_allow_headers {
    default "Content-Type,Authorization,X-CSRF-Token,X-Correlation-ID,Cache-Control,Pragma,X-Lyrics-Key,X-Auth-Device-Id,X-Auth-Device-Proof,X-Auth-Device-Proof-Ts,X-Auth-Device-Proof-Nonce";
}

map $host $earflow_cors_auth_range_allow_headers {
    default "Content-Type,Authorization,X-CSRF-Token,X-Correlation-ID,Cache-Control,Pragma,Range,If-Range,X-Lyrics-Key,X-Auth-Device-Id,X-Auth-Device-Proof,X-Auth-Device-Proof-Ts,X-Auth-Device-Proof-Nonce";
}

map $host $earflow_cors_playback_allow_headers {
    default "Authorization,X-Playback-Session,Range,If-Range,X-Correlation-ID,Cache-Control,Pragma,X-Auth-Device-Id,X-Auth-Device-Proof,X-Auth-Device-Proof-Ts,X-Auth-Device-Proof-Nonce";
}
