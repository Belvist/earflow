# Shared request and connection limit zones.
limit_req_zone $binary_remote_addr zone=api_limit:16m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:16m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:16m rate=5r/s;
limit_req_zone $binary_remote_addr zone=hls_limit:16m rate=30r/s;
limit_req_zone $binary_remote_addr zone=media_limit:16m rate=20r/s;

limit_conn_zone $binary_remote_addr zone=conn_limit:16m;
limit_conn_zone $binary_remote_addr zone=hls_conn_limit:16m;
limit_conn_zone $binary_remote_addr zone=media_conn_limit:16m;

limit_req_status 429;
limit_conn_status 429;
