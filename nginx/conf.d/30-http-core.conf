# HTTP defaults, cache zones, request limits, and timeout hardening.
access_log /dev/stdout main;

sendfile on;
tcp_nopush on;
tcp_nodelay on;

keepalive_timeout 65;
keepalive_requests 1000;

proxy_cache_path /var/cache/nginx/ebap_cache levels=1:2 keys_zone=ebap_cache:64m max_size=10g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/audio_cache levels=1:2 keys_zone=audio_cache:64m max_size=20g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/static_cache levels=1:2 keys_zone=static_cache:16m max_size=1g inactive=30d use_temp_path=off;

client_max_body_size 20M;
client_body_buffer_size 16k;
client_header_buffer_size 1k;
large_client_header_buffers 4 16k;

client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 30s;

proxy_read_timeout 60s;
proxy_connect_timeout 10s;
proxy_send_timeout 60s;

ignore_invalid_headers on;
underscores_in_headers off;
