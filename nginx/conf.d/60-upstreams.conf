# Internal upstreams. Keep service names aligned with docker-compose service names.
upstream frontend {
    zone frontend_zone 64k;
    server frontend:3004 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream artist_frontend {
    zone artist_frontend_zone 64k;
    server artist-frontend:3005 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream upload_service {
    zone upload_service_zone 64k;
    server upload-service:3002 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream artist_service {
    zone artist_service_zone 64k;
    server artist-service:3040 resolve max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream api_gateway {
    least_conn;
    zone api_gateway_zone 64k;
    server api-gateway:3000 resolve max_fails=3 fail_timeout=30s weight=1;
    keepalive 512;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream artist_api_gateway {
    least_conn;
    zone artist_api_gateway_zone 64k;
    server artist-api-gateway:3000 resolve max_fails=3 fail_timeout=30s weight=1;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream artist_portal_service {
    zone artist_portal_service_zone 64k;
    server artist-portal-service:3085 resolve max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream ebap_hls_adapter {
    zone ebap_hls_adapter_zone 64k;
    server ebap-hls-adapter:3095 resolve max_fails=3 fail_timeout=30s;
    keepalive 128;
}

upstream direct_stream_service {
    zone direct_stream_service_zone 64k;
    server direct-stream-service:3096 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream minio_backend {
    zone minio_zone 64k;
    server minio:9000 resolve max_fails=3 fail_timeout=30s;
    keepalive 256;
}
