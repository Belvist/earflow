# Media/HLS maps. Kept separate because these variables are high-risk to edit.
map $status $log_media_failure {
    default 0;
    ~^[45] 1;
}

map $http_origin $cors_earflow_origin {
    default "";
    ~*^https?://(www\.)?earflow\.ru(:\d+)?$ $http_origin;
    ~*^https?://(www\.)?auth\.earflow\.ru(:\d+)?$ $http_origin;
    ~*^https?://(www\.)?artists\.earflow\.ru(:\d+)?$ $http_origin;
    ~*^https?://(www\.)?cdn\.earflow\.ru(:\d+)?$ $http_origin;
}

map $cookie_mp_hls $has_mp_hls_cookie {
    default 0;
    ~.+ 1;
}

map $arg_token $has_hls_token {
    default 0;
    ~.+ 1;
}

map "$has_mp_hls_cookie:$has_hls_token" $hls_auth_ok {
    default 0;
    "1:0" 1;
    "0:1" 1;
    "1:1" 1;
}

map $has_hls_token $hls_asset_cache_control {
    default "private, no-store";
    0 "private, no-store";
    1 "public, max-age=31536000, immutable";
}

map $cookie_mp_hls $mp_hls_hash8 {
    default "";
    ~^1\.[^.]+\.[0-9]+\.([A-Za-z0-9_-]+)\.[0-9]+\.[A-Za-z0-9_-]+$ $1;
}
