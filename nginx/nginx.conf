            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Vary;

            add_header Access-Control-Allow-Origin $cors_earflow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type, Retry-After, X-Stream-Error" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Timing-Allow-Origin $cors_earflow_origin always;
            add_header Vary "Origin" always;
        }

        location = /api/stream/v2/session {
