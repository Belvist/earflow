    # ==========================================================================
    # MAIN API SERVER: api.earflow.ru
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.earflow.ru;

        ssl_certificate /etc/letsencrypt/live/earflow.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/earflow.ru/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        limit_req zone=api_limit burst=1000 nodelay;
        limit_conn conn_limit 100;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        location ~ (^|/)\.(?!well-known/(acme-challenge|security\.txt)) {
            return 404;
        }

        location ~* \.(?:sql|bak|backup|old|tmp|temp|log|conf|ini|yml|yaml|json)$ {
            return 444;
        }

        location = / {
            return 404;
        }

        location /ws {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location /socket.io/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location ^~ /api/stream/v3/session {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_earflow_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers $earflow_cors_auth_allow_headers always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary "Origin" always;
                return 204;
            }

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Auth-Device-Id $http_x_auth_device_id;
            proxy_set_header X-Auth-Device-Proof $http_x_auth_device_proof;
