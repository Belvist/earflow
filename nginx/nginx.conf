        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-src 'self' https://oauth.telegram.org; frame-ancestors 'self'; object-src 'none'" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        limit_req zone=api_limit burst=1000 nodelay;
        limit_conn conn_limit 100;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        location ~ (^|/)\.(?!well-known/(acme-challenge|security\.txt)) {
            return 404;
        }

        location ~* \.(?:sql|bak|backup|old|tmp|temp|log|conf|ini|yml|yaml|json)$ {
            return 444;
        }

        location ^~ /internal/ {
            return 404;
        }

        location ^~ /covers/ {
            proxy_pass http://upload_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ^~ /api/artist-portal/ {
            client_max_body_size 250M;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_artists_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-CSRF-Token,X-Correlation-ID" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary "Origin" always;
                return 204;
            }

            proxy_pass http://artist_api_gateway;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Vary;

            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;

            add_header Cache-Control "private, no-store" always;
            add_header Access-Control-Allow-Origin $cors_artists_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary "Origin" always;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_artists_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-CSRF-Token,X-Correlation-ID" always;
