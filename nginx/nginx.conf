    # ==========================================================================
    # INTERNAL SERVER (for Docker healthchecks on port 80)
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        location / {
            return 444;
        }
    }
}
