            proxy_pass http://direct_stream_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Vary;

            add_header Accept-Ranges bytes always;
            add_header Access-Control-Allow-Origin $cors_earflow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Timing-Allow-Origin $cors_earflow_origin always;
            add_header Vary "Origin" always;
        }

        location ^~ /media/direct-audio/ {
            internal;
            access_log /dev/stdout media_json if=$log_media_failure;

            slice 256k;

            proxy_cache audio_cache;
            proxy_cache_key "audiov1:$uri:$slice_range";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 206 30d;
            proxy_cache_valid 404 1s;
            proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;

