            proxy_set_header If-Range $http_if_range;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_buffering on;
            proxy_buffers 8 128k;
            proxy_buffer_size 64k;
            proxy_request_buffering off;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-version-id;

            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-store" always;

            add_header Access-Control-Allow-Origin $cors_earflow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Origin" always;
        }

        location ^~ /media/ {
            limit_req zone=media_limit burst=600 nodelay;
            limit_conn media_conn_limit 50;
            access_log /dev/stdout media_json if=$log_media_failure;
            
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_earflow_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary "Origin" always;
                return 204;
            }
            
            auth_request /internal/media-auth?$args;
            
            proxy_pass http://minio_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            proxy_buffering off;
            proxy_request_buffering off;
            
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Cross-Origin-Resource-Policy;
            
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-store" always;
            add_header Access-Control-Allow-Origin $cors_earflow_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Range, If-Range" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Origin" always;
        }

        location = /internal/media-auth {
            internal;
            access_log off;
            limit_req zone=media_limit burst=600 nodelay;
            if ($args !~* "(^|&)X-Amz-Algorithm=[^&]+") { return 403; }
            if ($args !~* "(^|&)X-Amz-Credential=[^&]+") { return 403; }
            if ($args !~* "(^|&)X-Amz-Date=[^&]+") { return 403; }
            if ($args !~* "(^|&)X-Amz-Expires=[^&]+") { return 403; }
            if ($args !~* "(^|&)X-Amz-SignedHeaders=[^&]+") { return 403; }
            if ($args !~* "(^|&)X-Amz-Signature=[^&]+") { return 403; }
            return 200;
        }

        location ^~ /covers/ {
            proxy_pass http://upload_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            add_header Cache-Control "public, max-age=604800, immutable";
            proxy_buffer_size 32k;
            proxy_buffers 8 64k;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_earflow_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
                add_header Access-Control-Allow-Headers $earflow_cors_auth_range_allow_headers always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary "Origin" always;
                return 204;
            }

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Auth-Device-Id $http_x_auth_device_id;
            proxy_set_header X-Auth-Device-Proof $http_x_auth_device_proof;
            proxy_set_header X-Auth-Device-Proof-Ts $http_x_auth_device_proof_ts;
            proxy_set_header X-Auth-Device-Proof-Nonce $http_x_auth_device_proof_nonce;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Vary;

            add_header Access-Control-Allow-Origin $cors_earflow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary "Origin" always;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name strmhaha.earflow.ru origin.strmhaha.earflow.ru;

        ssl_certificate /etc/letsencrypt/live/earflow.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/earflow.ru/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        limit_req zone=media_limit burst=600 nodelay;
        limit_conn media_conn_limit 50;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        location = /health {
            proxy_pass http://direct_stream_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location ^~ /audio/v3/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_earflow_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers $earflow_cors_playback_allow_headers always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary "Origin" always;
                return 204;
            }

            if ($http_sec_fetch_mode ~* "^navigate$") { return 403; }
            if ($http_sec_fetch_dest ~* "^document$") { return 403; }

            proxy_pass http://direct_stream_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Playback-Session $http_x_playback_session;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Vary;

            add_header Access-Control-Allow-Origin $cors_earflow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Type, Retry-After, X-Stream-Error" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Timing-Allow-Origin $cors_earflow_origin always;
            add_header Vary "Origin" always;
        }

        location ^~ /audio/v1/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_earflow_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary "Origin" always;
                return 204;
            }

            if ($http_sec_fetch_mode ~* "^navigate$") { return 403; }
