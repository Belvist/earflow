    # ==========================================================================
    # HTTP -> HTTPS REDIRECT
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name earflow.ru www.earflow.ru;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://earflow.ru$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.earflow.ru localhost;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
