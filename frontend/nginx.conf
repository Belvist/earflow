# =============================================================================
# Nginx configuration for React SPA - Production
# =============================================================================
# ВАЖНО: Этот nginx только раздаёт статику React SPA
# Все API/WebSocket/Covers проксируются основным nginx load balancer
# Security headers добавляются в основном nginx (nginx/nginx.conf)
# =============================================================================

server {
    listen 3004;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Скрываем версию nginx
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        alias /tmp/runtime-config.js;
    }
    
    # Static assets - long cache (immutable)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    
    # Unhashed mini-player overrides — must update with each release (?v= in index.html)
    location ~* ^/mini-player-overrides\.css {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # JS/CSS - React build создаёт файлы с хэшами (main.abc123.js)
    # Все JS/CSS кэшируем с immutable - имена уникальные при изменениях
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    
    # Service Worker - no cache
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }
    
    # Manifest - short cache
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        default_type image/x-icon;
        try_files /favicon.ico =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* ^/favicon-(16x16|32x32|192|512)\.png$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /logo192.png {
        try_files /logo192.svg =404;
    }
    
    # =========================================================================
    # ВАЖНО: /api/, /ws, /covers/ проксируются основным nginx (load balancer)
    # Frontend nginx раздаёт ТОЛЬКО статические файлы React SPA
    # =========================================================================
    
    # SPA fallback - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # index.html - no cache (for updates)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
    
    # Disable access log for health checks
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
