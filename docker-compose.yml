    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Track Processor (Auto-import with cover compression)
  track-processor:
    build:
      context: ./backend/track-processor
      dockerfile: Dockerfile
    container_name: music-track-processor
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_SERVICE_URL: http://database-service:3003
      SERVICE_KEY_TRACK_PROCESSOR: ${SERVICE_KEY_TRACK_PROCESSOR}
      # Scan the mounted library directly
      SOURCE_FOLDER: /app/uploads/library
      # MinIO Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS}
      STORAGE_MODE: ${STORAGE_MODE:-minio}
    volumes:
      # Shared upload directory with upload-service
      - upload-files:/app/uploads
      # Mount favorites folder directly to library
      - "${MUSIC_SOURCE_DIR:-./data/music}:/app/uploads/library:ro"
    depends_on:
      database-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped

  # ==========================================================================
  # Device Sync Service (Spotify Connect-like). INTERNAL ONLY — go-api-gateway
  # proxies /api/devices/* and /ws/devices to this container.
  #
  # Rollback plan:
  #   1) flip DEVICE_SYNC_ENABLED=false in .env and `docker compose up -d
  #      device-sync-service api-gateway`. The service stays up but answers
  #      503 FEATURE_DISABLED on HTTP and closes WS upgrades with 503.
  #      The frontend's REACT_APP_DEVICE_SYNC_ENABLED also defaults to false,
  #      so a stale build won't poll a dead endpoint.
  #   2) If the container itself is wedged: `docker compose stop
  #      device-sync-service`. go-api-gateway will then 502 /api/devices/*
  #      for anyone with REACT_APP_DEVICE_SYNC_ENABLED=true; users with the
  #      default build see nothing.
  # ==========================================================================
  device-sync-service:
    build:
      context: ./backend/device-sync-service
      dockerfile: Dockerfile
    container_name: music-device-sync-service
    expose:
      - "3050"
    environment:
      PORT: 3050
      NODE_ENV: ${NODE_ENV}
      INSTANCE_ID: ${HOSTNAME:-device-sync}
      DEVICE_SYNC_ENABLED: ${DEVICE_SYNC_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      DEVICE_SYNC_WS_TICKET_SECRET: ${DEVICE_SYNC_WS_TICKET_SECRET:-}
      WS_TICKET_TTL: 60s
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 3
      REDIS_POOL_SIZE: ${DEVICE_SYNC_REDIS_POOL_SIZE:-50}
      REDIS_MIN_IDLE: ${DEVICE_SYNC_REDIS_MIN_IDLE:-10}
      MAX_DEVICES_PER_USER: ${DEVICE_SYNC_MAX_PER_USER:-30}
      DEVICE_TTL_SECONDS: ${DEVICE_SYNC_DEVICE_TTL_SECONDS:-900}
      HEARTBEAT_GRACE_SECONDS: ${DEVICE_SYNC_HEARTBEAT_GRACE_SECONDS:-60}
      NOW_PLAYING_TTL_SECONDS: ${DEVICE_SYNC_NOW_PLAYING_TTL_SECONDS:-3600}
      WS_RATE_LIMIT_MESSAGES_PER_SECOND: ${DEVICE_SYNC_WS_RATE_LIMIT_PER_SECOND:-8}
      WS_READ_LIMIT_BYTES: 4096
      WS_READ_TIMEOUT: 60s
      WS_WRITE_TIMEOUT: 10s
      WS_PING_INTERVAL: 25s
      WS_WRITE_BUFFER: 64
      MAX_COMMAND_PAYLOAD_BYTES: 2048
      RATE_LIMIT_WINDOW: 60s
      RATE_LIMIT_MAX_REQUESTS: ${DEVICE_SYNC_RATE_LIMIT_MAX:-120}
      HTTP_READ_HEADER_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 120s
      SHUTDOWN_TIMEOUT: 30s
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: http://auth-service:3001
      # SEC-005 Phase 8: распознаём opaque WS connect tickets (device-bound stream auth)
      # ACCEPT-двуxmode — принимает и opaque, и legacy JWT; ENFORCE отдельным gate.
      STREAM_TICKET_ACCEPT: ${STREAM_TICKET_ACCEPT:-1}
      STREAM_TICKET_ENFORCE: ${STREAM_TICKET_ENFORCE:-0}
      STREAM_TICKET_AUTH_REDIS_HOST: redis-auth
      STREAM_TICKET_AUTH_REDIS_PORT: 6379
      STREAM_TICKET_AUTH_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '1.0'
        reservations:
          memory: 48M
          cpus: '0.25'
    healthcheck:
      # Distroless has no shell: the service binary itself implements the
      # probe via --healthcheck → GET /health → exit 0/1.
      test: [ "CMD", "/app/device-sync-service", "--healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  device-sync-stress:
    build:
      context: ./backend/device-sync-service
      dockerfile: Dockerfile
    container_name: music-device-sync-stress
    profiles:
      - device-sync-test
    entrypoint: [ "/app/device-sync-smoke" ]
    command:
      - "-base-url"
      - "http://device-sync-service:3050"
      - "-user-id"
      - "${DEVICE_SYNC_TEST_USER_ID:-device-sync-stress}"
      - "-accounts"
      - "${DEVICE_SYNC_TEST_ACCOUNTS:-10}"
      - "-devices"
      - "${DEVICE_SYNC_TEST_DEVICES:-5}"
      - "-transfers"
      - "${DEVICE_SYNC_TEST_TRANSFERS:-10}"
      - "-concurrency"
      - "${DEVICE_SYNC_TEST_CONCURRENCY:-5}"
      - "-timeout"
      - "${DEVICE_SYNC_TEST_TIMEOUT:-2m}"
      - "-step-timeout"
      - "${DEVICE_SYNC_TEST_STEP_TIMEOUT:-5s}"
    depends_on:
      device-sync-service:
        condition: service_healthy
    networks:
      - music-network
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  # ==========================================================================
  # NATS (JetStream) - Party v2 event bus (INTERNAL ONLY)
  # ==========================================================================
  nats:
    image: nats:2.10.26-alpine
    container_name: music-nats
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--port"
      - "4222"
    expose:
      - "4222"
      - "8222"
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8222/healthz > /dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Party (Go) - State: REST + NATS + Redis. INTERNAL ONLY (via api-gateway).
  # ==========================================================================
  party-state-service:
    build:
      context: ./backend/party-go
      dockerfile: Dockerfile.state
    container_name: music-party-state-service
    expose:
      - "3130"
    environment:
      PORT: 3130
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 2
      NATS_URL: nats://nats:4222
      PARTY_V2_WS_TOKEN_SECRET: ${PARTY_V2_WS_TOKEN_SECRET:-}
      # Go stateserver reads PARTY_V2_* only; alias legacy PARTY_SESSION_* / PARTY_INVITE_* from .env
      PARTY_V2_SESSION_TTL_SECONDS: ${PARTY_V2_SESSION_TTL_SECONDS:-${PARTY_SESSION_TTL_SECONDS:-7200}}
      PARTY_V2_INVITE_TTL_SECONDS: ${PARTY_V2_INVITE_TTL_SECONDS:-${PARTY_INVITE_TTL_SECONDS:-3600}}
      PARTY_V2_SHARD_COUNT: ${PARTY_V2_SHARD_COUNT:-64}
      PARTY_MAX_PER_USER: ${PARTY_MAX_PER_USER:-3}
      PARTY_MAX_PARTICIPANTS: ${PARTY_MAX_PARTICIPANTS:-50}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: [ "CMD", "/party-state", "--healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # Party (Go) - WebSocket gateway. INTERNAL ONLY (api-gateway /ws/v2 -> here).
  # ==========================================================================
  party-gateway-service:
    build:
      context: ./backend/party-go
      dockerfile: Dockerfile.gateway
    container_name: music-party-gateway-service
    expose:
      - "3131"
    environment:
      PORT: 3131
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      PARTY_V2_WS_TOKEN_SECRET: ${PARTY_V2_WS_TOKEN_SECRET:-}
      PARTY_V2_SHARDS: ${PARTY_V2_SHARDS:-}
      PARTY_V2_SHARD_COUNT: ${PARTY_V2_SHARD_COUNT:-64}
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: [ "CMD", "/party-gateway", "--healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # EBAP Encoder Worker (CPU-bound, isolated from streaming)
  # ==========================================================================
  ebap-encoder-worker:
    build:
      context: ./backend/ebap-encoder-worker
      dockerfile: Dockerfile
    container_name: music-ebap-encoder-worker
    expose:
      - "3091"
    environment:
      NODE_ENV: ${NODE_ENV}
      HEALTH_PORT: ${EBAP_WORKER_HEALTH_PORT:-3091}
      SYSTEM_ROOT_SECRET: ${SYSTEM_ROOT_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${EBAP_WORKER_DB_MAX_CONNECTIONS:-6}
      DB_MIN_CONNECTIONS: ${EBAP_WORKER_DB_MIN_CONNECTIONS:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      EBAP_MINIO_BUCKET: ${EBAP_MINIO_BUCKET:-ebap-cache}
      EBAP_MANIFEST_PREFIX: ${EBAP_MANIFEST_PREFIX:-manifests/}
      EBAP_TRACK_KEY_MASTER_SECRET: ${EBAP_TRACK_KEY_MASTER_SECRET:-}
      EBAP_TRACK_KEY_MASTER_SECRETS: ${EBAP_TRACK_KEY_MASTER_SECRETS:-}
      EBAP_MAX_CHUNK_BYTES: ${EBAP_MAX_CHUNK_BYTES:-131072}
      EBAP_TARGET_CHUNK_SECONDS: ${EBAP_TARGET_CHUNK_SECONDS:-8}
      EBAP_S3_TIMEOUT_MS: ${EBAP_S3_TIMEOUT_MS:-5000}
      EBAP_MAX_INFLIGHT_UPLOADS: ${EBAP_MAX_INFLIGHT_UPLOADS:-8}
      WORKER_POLL_INTERVAL_MS: ${EBAP_WORKER_POLL_INTERVAL_MS:-750}
      WORKER_IDLE_SLEEP_MS: ${EBAP_WORKER_IDLE_SLEEP_MS:-5000}
      FFMPEG_THREADS: ${EBAP_WORKER_FFMPEG_THREADS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=2048M
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://127.0.0.1:' + (Bun.env.HEALTH_PORT ?? '3091') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3072M
        reservations:
          cpus: '0.25'
          memory: 512M

  # ==========================================================================
  # Transcode Worker (multi-quality AAC encoding for adaptive streaming)
  # ==========================================================================
  transcode-worker:
    build:
      context: ./backend/transcode-worker
      dockerfile: Dockerfile
    container_name: music-transcode-worker
    expose:
      - "3098"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_MAX_CONNECTIONS: ${TRANSCODE_DB_MAX_CONNECTIONS:-2}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      TRANSCODE_CONCURRENCY: 2
      WAVEFORM_CONCURRENCY: 1
      TRANSCODE_POLL_MS: 5000
      TRANSCODE_WORK_DIR: /tmp/transcode-work
      TRANSCODE_ENABLE_OPUS: "true"
      TRANSCODE_ENABLE_FLAC: "true"
      TRANSCODE_ENABLE_LOUDNORM: "true"
      TRANSCODE_SHUTDOWN_TIMEOUT_MS: 120000
      TRANSCODE_FAILED_MAX_RETRIES: 5
      TRANSCODE_FAILED_RETRY_INTERVAL_MS: 3600000
      TRANSCODE_FAILED_RETRY_BATCH: 20
      HEALTH_PORT: ${TRANSCODE_WORKER_HEALTH_PORT:-3098}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "const p=process.env.HEALTH_PORT||'3098'; require('http').get('http://127.0.0.1:'+p+'/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=4096M
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==========================================================================
  # Metadata Parser Service (ID3/tag extraction on upload)
  # ==========================================================================
  metadata-parser-service:
    build:
      context: ./backend/metadata-parser-service
      dockerfile: Dockerfile
    container_name: music-metadata-parser
    expose:
      - "3072"
    environment:
      NODE_ENV: production
      PORT: "3072"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_MAX_CONNECTIONS: ${METADATA_DB_MAX_CONNECTIONS:-5}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS:-music-covers}
      METADATA_CONCURRENCY: "2"
      METADATA_POLL_MS: "5000"
      METADATA_MAX_FILE_BYTES: "524288"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256M
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3072/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ==========================================================================
  # Import Service (MusicBrainz + Spotify metadata enrichment)
  # ==========================================================================
  import-service:
    build:
      context: ./backend/import-service
      dockerfile: Dockerfile
    container_name: music-import-service
    expose:
      - "3073"
    environment:
      NODE_ENV: production
      PORT: "3073"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_MAX_CONNECTIONS: ${IMPORT_DB_MAX_CONNECTIONS:-3}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-EarflowMusicPlatform/1.0 (contact@earflow.ru)}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3073/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ==========================================================================
  # EBAP HLS Packager Worker (CPU-bound, background HLS VOD generation)
  # ==========================================================================
  ebap-hls-packager-worker:
    build:
      context: ./backend/ebap-hls-packager-worker
      dockerfile: Dockerfile
    container_name: music-ebap-hls-packager-worker
    expose:
      - "3092"
    environment:
      NODE_ENV: ${NODE_ENV}
      HEALTH_PORT: ${EBAP_HLS_PACKAGER_HEALTH_PORT:-3092}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${EBAP_HLS_PACKAGER_DB_MAX_CONNECTIONS:-10}
      DB_MIN_CONNECTIONS: ${EBAP_HLS_PACKAGER_DB_MIN_CONNECTIONS:-0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      EBAP_MINIO_BUCKET: ${EBAP_MINIO_BUCKET:-ebap-cache}
      EBAP_MANIFEST_PREFIX: ${EBAP_MANIFEST_PREFIX:-manifests/}
      EBAP_HLS_MINIO_BUCKET: ${EBAP_HLS_MINIO_BUCKET:-ebap-hls}
      EBAP_HLS_PREFIX: ${EBAP_HLS_PREFIX:-hls/v1/}
      EBAP_S3_TIMEOUT_MS: ${EBAP_S3_TIMEOUT_MS:-5000}
      WORKER_POLL_INTERVAL_MS: ${EBAP_WORKER_POLL_INTERVAL_MS:-750}
      WORKER_IDLE_SLEEP_MS: ${EBAP_WORKER_IDLE_SLEEP_MS:-5000}
      FFMPEG_THREADS: ${EBAP_HLS_PACKAGER_FFMPEG_THREADS:-2}
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-2}
      HLS_AAC_BITRATE_1_K: ${HLS_AAC_BITRATE_1_K:-256}
      HLS_AAC_BITRATE_2_K: ${HLS_AAC_BITRATE_2_K:-128}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=2048M
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://127.0.0.1:' + (Bun.env.HEALTH_PORT ?? '3092') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
        reservations:
          cpus: '0.25'
          memory: 512M

  # ==========================================================================
  # Nginx Load Balancer - Entry Point (Hardened Build with HTTPS)
  # ==========================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: music-nginx-lb:hardened
    container_name: music-nginx-lb
    command: [ "sh", "-c", "mkdir -p /var/cache/nginx/client_temp /var/cache/nginx/proxy_temp /var/cache/nginx/ebap_cache /var/cache/nginx/audio_cache /var/cache/nginx/fastcgi_temp /var/cache/nginx/uwsgi_temp /var/cache/nginx/scgi_temp && chown -R nginx:nginx /var/cache/nginx && exec nginx -g 'daemon off;'" ]
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    ports:
      - "80:80" # HTTP (redirect to HTTPS + ACME challenge)
      - "443:443" # HTTPS
      - "127.0.0.1:8443:443" # Internal-only HTTPS for SSH tunnel (admin/metrics)
      - "127.0.0.1:8085:8085" # Internal-only HTTP for SSH tunnel (admin/metrics)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # include + статика: иначе при bind mounts и старом образе nginx не стартует
      - ./nginx/include-maintenance.conf:/etc/nginx/include-maintenance.conf:ro
      - ./nginx/html/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      api-gateway:
        condition: service_healthy
      artist-api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/nginx-health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  certbot:
    image: certbot/certbot:latest
    container_name: music-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: [ "sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --non-interactive --quiet; sleep 12h; done" ]
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  nginx-cert-reloader:
    image: alpine:3.21
    container_name: music-nginx-cert-reloader
    pid: "service:nginx"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: [ "sh", "-c", "apk add --no-cache inotify-tools >/dev/null 2>&1 && while inotifywait -e close_write,create,delete,move -r /etc/letsencrypt/live >/dev/null 2>&1; do kill -HUP 1; done" ]
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # API Gateway (Scalable - multiple instances behind nginx)
  # ==========================================================================
  api-gateway:
    build:
      context: ./backend/go-api-gateway
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
    # НЕ указываем container_name - позволяет масштабирование
    deploy:
      replicas: ${API_GATEWAY_REPLICAS:-2} # По умолчанию 2 инстанса
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    # Порт НЕ экспортируем наружу - только через nginx
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV}
      APP_VERSION: ${APP_VERSION:-local}
      GIT_SHA: ${GIT_SHA:-local}
      JWT_SECRET: ${JWT_SECRET}
      PARTY_V2_WS_TOKEN_SECRET: ${PARTY_V2_WS_TOKEN_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-earflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-earflow-api}
      DEBUG_AUTH: ${DEBUG_AUTH:-0}
      TRUST_PROXY: "1"
      LOAD_TEST_MODE: ${LOAD_TEST_MODE:-false}
      GATEWAY_RATE_LIMIT_MULTIPLIER: ${GATEWAY_RATE_LIMIT_MULTIPLIER:-}
      LOAD_TEST_RATE_LIMIT_MULTIPLIER: ${LOAD_TEST_RATE_LIMIT_MULTIPLIER:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.earflow.ru}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      SERVICE_KEY_API_GATEWAY: ${SERVICE_KEY_API_GATEWAY}
      AUTH_PG_SOT_MODE: ${AUTH_PG_SOT_MODE:-off}
      SECURITY_SERVICE_URL: http://security-service:3074

      CLIENT_ERROR_LOG_ENABLED: ${CLIENT_ERROR_LOG_ENABLED:-false}

      GATEWAY_ADMIN_USER: ${GATEWAY_ADMIN_USER:-}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:-}

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3001}
      AUTH_LEGACY_SERVICE_URL: ${AUTH_LEGACY_SERVICE_URL:-http://auth-service:3001}
      UPLOAD_SERVICE_URL: http://upload-service:3002
      DATABASE_SERVICE_URL: http://database-service:3003
      RECOMMENDATIONS_SERVICE_URL: http://recommendations-service:3006
      PLAYLIST_SERVICE_URL: http://playlist-service:3020
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3010
      LYRICS_SERVICE_URL: http://lyrics-service:3010
      PARTY_SERVICE_URL: http://party-state-service:3130
      PARTY_V2_STATE_URL: http://party-state-service:3130
      PARTY_V2_GATEWAY_URL: http://party-gateway-service:3131
      DEVICE_SYNC_SERVICE_URL: http://device-sync-service:3050
      EBAP_HLS_ADAPTER_URL: http://ebap-hls-adapter:3095
      DIRECT_STREAM_SERVICE_URL: http://direct-stream-service:3096
      ARTIST_SERVICE_URL: http://artist-service:3040
      SEARCH_SERVICE_URL: http://search-service:3062
      METADATA_PARSER_SERVICE_URL: http://metadata-parser-service:3072
      IMPORT_SERVICE_URL: http://import-service:3073
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOW_TUNNEL_ORIGINS: ${ALLOW_TUNNEL_ORIGINS:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_AUTH_HOST: redis-auth
      REDIS_AUTH_PORT: 6379
      REDIS_AUTH_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_RL_HOST: redis
      REDIS_RL_PORT: 6379
      REDIS_RL_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-31536000}
      # SEC-005 Phase 8: WS opaque ticket TTL. Default 60s слишком короткий
      # для слабых сетей и пере-подключений; 120s — max безопасный.
      STREAM_TICKET_WS_TTL_SECONDS: ${STREAM_TICKET_WS_TTL_SECONDS:-120}
    depends_on:
      auth-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendations-service:
        condition: service_healthy
      playlist-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      lyrics-service:
        condition: service_healthy
      party-state-service:
        condition: service_healthy
      ebap-hls-adapter:
        condition: service_healthy
      artist-service:
        condition: service_healthy
      metadata-parser-service:
        condition: service_healthy
      import-service:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend - Production Build with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: music-frontend
    expose:
      - "3004"
    environment:
      NODE_ENV: production
      EARFLOW_TELEGRAM_BOT_USERNAME: ${EARFLOW_TELEGRAM_BOT_USERNAME:-}
      EARFLOW_TELEGRAM_BOT_ID: ${EARFLOW_TELEGRAM_BOT_ID:-}
      EARFLOW_TELEGRAM_AUTH_ORIGIN: ${EARFLOW_TELEGRAM_AUTH_ORIGIN:-}
      REACT_APP_TELEGRAM_BOT_USERNAME: ${REACT_APP_TELEGRAM_BOT_USERNAME:-}
      EARFLOW_API_BASE_URL: ${EARFLOW_API_BASE_URL:-}
      EARFLOW_STREAMING_BASE_URL: ${EARFLOW_STREAMING_BASE_URL:-https://api.earflow.ru}
      EARFLOW_ENABLE_DIRECT_STREAM: ${EARFLOW_ENABLE_DIRECT_STREAM:-true}
      # Device Sync (Connect-like) runtime flag. Default OFF so existing
      # builds stay inert until you flip it here and restart the frontend.
      EARFLOW_DEVICE_SYNC_ENABLED: ${EARFLOW_DEVICE_SYNC_ENABLED:-false}
    volumes:
      - ./frontend/public/content:/usr/share/nginx/html/content:ro
    networks:
      - music-network
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3004/ > /dev/null || wget -qO- http://localhost:3004/ > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M,uid=1001,gid=1001
      - /var/run:size=8M,uid=1001,gid=1001
      - /var/log/nginx:size=32M,uid=1001,gid=1001
      - /tmp:size=16M,uid=1001,gid=1001

  # Prerender Server (SEO bot rendering). Read-only, no cookies.
  prerender:
    build:
      context: ./backend/prerender-service
      dockerfile: Dockerfile
      target: production
    container_name: music-prerender
    expose:
      - "3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      PRERENDER_ALLOWED_HOSTS: "frontend:3004"
      PRERENDER_NAV_TIMEOUT_MS: ${PRERENDER_NAV_TIMEOUT_MS:-15000}
      PRERENDER_SETTLE_MS: ${PRERENDER_SETTLE_MS:-3000}
      PRERENDER_PAGE_CACHE_TTL_MS: ${PRERENDER_PAGE_CACHE_TTL_MS:-3600000}
      # Один запрос за раз — стабильность на 8GB VPS; кэш 1h сглаживает latency.
      PRERENDER_MAX_CONCURRENT: ${PRERENDER_MAX_CONCURRENT:-1}
    networks:
      - music-network
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3100/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))\"" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,uid=1001,gid=1001
      - /var/cache:size=32M,uid=1001,gid=1001

  # Artist Frontend - Production Build with Nginx
  artist-frontend:
    build:
      context: ./artist-frontend
      dockerfile: Dockerfile
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: music-artist-frontend
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      EARFLOW_TELEGRAM_BOT_USERNAME: ${EARFLOW_TELEGRAM_BOT_USERNAME:-}
      EARFLOW_TELEGRAM_BOT_ID: ${EARFLOW_TELEGRAM_BOT_ID:-}
      EARFLOW_TELEGRAM_AUTH_ORIGIN: ${EARFLOW_TELEGRAM_AUTH_ORIGIN:-}
      REACT_APP_TELEGRAM_BOT_USERNAME: ${REACT_APP_TELEGRAM_BOT_USERNAME:-}
      EARFLOW_ARTIST_CSRF_COOKIE_NAME: "mp_csrf_artists"
    networks:
      - music-network
    restart: unless-stopped
    depends_on:
      artist-api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3005/ > /dev/null || wget -qO- http://localhost:3005/ > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M,uid=1001,gid=1001
      - /var/run:size=8M,uid=1001,gid=1001
      - /var/log/nginx:size=32M,uid=1001,gid=1001
      - /tmp:size=16M,uid=1001,gid=1001

  # ==========================================================================
  # Portainer - Docker Management UI (SECURE - localhost only!)
  # ==========================================================================
  # ⚠️ БЕЗОПАСНОСТЬ: Порт открыт ТОЛЬКО на 127.0.0.1
  # Доступ ТОЛЬКО через SSH туннель - никто извне не подключится!
  # ==========================================================================
  portainer:
    image: portainer/portainer-ce:2.33.5
    container_name: music-portainer
    restart: unless-stopped
    # КРИТИЧНО: Только localhost! Не 0.0.0.0!
    # ВАЖНО: Порт 9000 занят MinIO, используем 9002
    ports:
      - "127.0.0.1:9002:9000" # HTTP UI (внутри контейнера 9000)
      - "127.0.0.1:9443:9443" # HTTPS UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - music-network
    security_opt:
      - no-new-privileges:true
    environment:
      # Отключить телеметрию
      - PORTAINER_HIDE_TELEMETRY=true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: [ "CMD", "/portainer", "--version" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # pgAdmin - PostgreSQL Management (МАКСИМАЛЬНАЯ БЕЗОПАСНОСТЬ)
  # ==========================================================================
  # ⚠️ БЕЗОПАСНОСТЬ:
  # 1. Порт ТОЛЬКО на 127.0.0.1 - недоступен извне
  # 2. Доступ ТОЛЬКО через SSH туннель: ssh -L 5050:127.0.0.1:5050 root@сервер
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: music-pgadmin
    profiles: [ "tools" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Отключаем телеметрию и лишние функции
      PGADMIN_DISABLE_POSTFIX: "true"
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'⚠️ PRIVATE ACCESS ONLY'"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "40" # ERROR only
      # Автоматическое подключение к нашему PostgreSQL
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Файл с настройками серверов (создастся автоматически)
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - music-network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'

networks:
  music-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  upload-files:
    driver: local
  redis-data:
    driver: local
  redis-auth-data:
    driver: local
  minio-data:
    driver: local
  meilisearch-data:
    driver: local
  nginx_cache:
    driver: local
  portainer_data:
    driver: local
  pgadmin_data:
    driver: local
  certbot-webroot:
    driver: local
