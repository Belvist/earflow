      SERVICE_JWT_AUDIENCE: ${SERVICE_JWT_AUDIENCE_PLAYLIST:-playlist-service}
      CORS_ORIGIN: ${ALLOWED_ORIGINS}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      LIBRARY_USER_ID: ${LIBRARY_USER_ID:-1}
      RECO_RANKING_SERVICE_URL: ${RECO_RANKING_SERVICE_URL:-http://ranking-service:8080}
      PLAYLIST_HOME_COMPOSER_TIMEOUT_MS: ${PLAYLIST_HOME_COMPOSER_TIMEOUT_MS:-800}
      DISCOVER_SEED_BUCKET_HOURS: ${DISCOVER_SEED_BUCKET_HOURS:-6}
      DISCOVER_CACHE_TTL_SECONDS: ${DISCOVER_CACHE_TTL_SECONDS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ranking-service:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3020/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # Subscription Service (INTERNAL ONLY - access via api-gateway)
  # ==========================================================================
  subscription-service:
    build:
      context: ./backend/subscription-service
      dockerfile: Dockerfile
    container_name: music-subscription-service
    expose:
      - "3010"
    environment:
      PORT: 3010
      NODE_ENV: ${NODE_ENV}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${SUBSCRIPTION_DB_MAX_CONNECTIONS:-5}
      DB_IDLE_TIMEOUT_SECONDS: ${SUBSCRIPTION_DB_IDLE_TIMEOUT_SECONDS:-30}
      DB_CONNECTION_TIMEOUT_SECONDS: ${SUBSCRIPTION_DB_CONNECTION_TIMEOUT_SECONDS:-5}
      DB_PREPARE: ${SUBSCRIPTION_DB_PREPARE:-true}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
