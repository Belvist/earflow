      SERVICE_JWT_ISSUER: ${SERVICE_JWT_ISSUER:-database-service}
      SERVICE_JWT_AUDIENCE: ${SERVICE_JWT_AUDIENCE:-database-service}
      INTERNAL_ALLOWED_SERVICES: ${INTERNAL_ALLOWED_SERVICES:-api-gateway,artist-api-gateway,ebap-hls-adapter}
