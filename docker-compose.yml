        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: [ "sh", "-c", "node scripts/runMigrations.js && node workers/offlineWorker.js" ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3017/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

