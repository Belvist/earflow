      RECO_OFFLINE_USE_CACHED_GLOBAL_TOP: ${RECO_OFFLINE_USE_CACHED_GLOBAL_TOP:-false}
      RECO_OFFLINE_GLOBAL_TOP_MAX_PER_ARTIST: ${RECO_OFFLINE_GLOBAL_TOP_MAX_PER_ARTIST:-0}
      OFFLINE_WORKER_HEALTH_PORT: 3017

      # Configurable Weights (A/B Testing)
      RECO_WEIGHT_POPULARITY: ${RECO_WEIGHT_POPULARITY:-0.35}
      RECO_WEIGHT_PLAY_COUNT: ${RECO_WEIGHT_PLAY_COUNT:-0.25}
      RECO_WEIGHT_USER_PLAY_COUNT: ${RECO_WEIGHT_USER_PLAY_COUNT:-0.25}
      RECO_WEIGHT_USER_LIKE_COUNT: ${RECO_WEIGHT_USER_LIKE_COUNT:-0.20}
