# Music Platform - Complete System
# Backend + Frontend + Recommendations + Database

services:
  # PostgreSQL Database with pgvector (v15 for data compatibility)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: music-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/00-create-tables.sql:/docker-entrypoint-initdb.d/00-create-tables.sql
      - ./backend/init-library-user.sql:/docker-entrypoint-initdb.d/01-init-user.sql
      - ./backend/02-recommendations-schema.sql:/docker-entrypoint-initdb.d/02-recommendations-schema.sql
      - ./backend/03-subscription-schema.sql:/docker-entrypoint-initdb.d/03-subscription-schema.sql
      - ./backend/04-mood-schema.sql:/docker-entrypoint-initdb.d/04-mood-schema.sql
    networks:
      - music-network
    # SECURITY: Do NOT expose PostgreSQL to public network!
    # Use only internal Docker network for service communication
    # ports:
    #   - "127.0.0.1:5432:5432"  # Uncomment ONLY for local debugging
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  audio-features-worker:
    build:
      context: ./backend/audio-features-worker
      dockerfile: Dockerfile
    container_name: music-audio-features-worker
    environment:
      DB_SERVICE_URL: http://database-service:3003
      SERVICE_KEY_AUDIO_FEATURES_WORKER: ${SERVICE_KEY_AUDIO_FEATURES_WORKER}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      HEALTH_PORT: 3051
      POLL_INTERVAL_SECONDS: 30
      BATCH_LIMIT: 25
      REQUEST_TIMEOUT_SECONDS: 20
    expose:
      - "3051"
    depends_on:
      database-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3051/health', timeout=3).read()" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # Redis for caching - Pinned secure version
  redis:
    image: redis:7.4.2-alpine3.21
    container_name: music-redis
    # SECURITY: Redis with optional password authentication
    # Set REDIS_PASSWORD in .env for production security
    command: [ "sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru --tcp-keepalive 300 --timeout 0 --requirepass $$REDIS_PASSWORD; else redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru --tcp-keepalive 300 --timeout 0; fi" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # SECURITY: Do NOT expose Redis to public network!
    # Redis has no authentication by default - extremely dangerous!
    # ports:
    #   - "127.0.0.1:6379:6379"  # Uncomment ONLY for local debugging
    volumes:
      - redis-data:/data
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a $$REDIS_PASSWORD ping; else redis-cli ping; fi" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dedicated Redis for auth/session (no eviction allowed)
  redis-auth:
    image: redis:7.4.2-alpine3.21
    container_name: music-redis-auth
    command: [ "sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --tcp-keepalive 300 --timeout 0 --requirepass $$REDIS_PASSWORD; else redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --tcp-keepalive 300 --timeout 0; fi" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-auth-data:/data
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a $$REDIS_PASSWORD ping; else redis-cli ping; fi" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage for audio files and covers
  # ВАЖНО: Single-node режим требует стабильного I/O на диске
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: music-minio
    command: server /data --console-address ":9001"
    # SECURITY: MinIO console should only be accessible via VPN or internal network
    # S3 API accessible via nginx reverse proxy with authentication
    ports:
      - "127.0.0.1:9000:9000" # S3 API - localhost only
      - "127.0.0.1:9001:9001" # Console UI - localhost only
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Оптимизация для single-node с ограниченными ресурсами:
      # Отключаем фоновые задачи которые нагружают диск
      MINIO_SCANNER_SPEED: "slowest"
      MINIO_API_REQUESTS_MAX: "100"
      MINIO_API_REQUESTS_DEADLINE: "30s"
      # Увеличиваем толерантность к задержкам диска
      MINIO_DRIVE_SYNC: "off"
      # Отключаем версионирование для экономии I/O
      MINIO_API_ROOT_ACCESS: "on"
    volumes:
      - minio-data:/data
    networks:
      - music-network
    restart: unless-stopped
    # Увеличиваем таймауты для нестабильного I/O
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    # Лимитируем ресурсы чтобы не блокировать другие сервисы
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: music-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS}
      EBAP_MINIO_BUCKET: ${EBAP_MINIO_BUCKET:-ebap-cache}
      EBAP_HLS_MINIO_BUCKET: ${EBAP_HLS_MINIO_BUCKET:-ebap-hls}
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; mc mb --ignore-existing myminio/$${MINIO_BUCKET_AUDIO}; mc mb --ignore-existing myminio/$${MINIO_BUCKET_COVERS}; mc mb --ignore-existing myminio/$${EBAP_MINIO_BUCKET}; mc mb --ignore-existing myminio/$${EBAP_HLS_MINIO_BUCKET}; mc anonymous set download myminio/$${MINIO_BUCKET_COVERS}; mc anonymous set none myminio/$${MINIO_BUCKET_AUDIO}; mc anonymous set none myminio/$${EBAP_MINIO_BUCKET}; mc anonymous set none myminio/$${EBAP_HLS_MINIO_BUCKET}; echo 'MinIO buckets initialized successfully'; exit 0; "
    networks:
      - music-network

  upload-service-tests:
    build:
      context: ./backend/upload-service
      dockerfile: Dockerfile
      target: builder
    profiles: [ "tools" ]
    working_dir: /app
    volumes:
      - ./backend/upload-service/test:/app/test:ro
    environment:
      UPLOAD_SERVICE_BASE_URL: http://upload-service:3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      upload-service:
        condition: service_healthy
    networks:
      - music-network
    command: [ "node", "--test", "test/integration/all.test.js" ]

  integration-tests:
    build:
      context: ./backend/integration-tests
      dockerfile: Dockerfile
    profiles: [ "tools" ]
    environment:
      IT_GATEWAY_BASE_URL: http://api-gateway:3000
      IT_DIRECT_STREAM_BASE_URL: http://direct-stream-service:3096
      IT_ADAPTER_BASE_URL: http://ebap-hls-adapter:3095
      IT_PARTY_BASE_URL: http://party-state-service:3130
      IT_PARTY_GATEWAY_URL: http://party-gateway-service:3131
      IT_ORIGIN: ${IT_ORIGIN:-https://earflow.ru}
      IT_TRACK_READY_ID: ${IT_TRACK_READY_ID:-}
      IT_TRACK_NOT_READY_ID: ${IT_TRACK_NOT_READY_ID:-}
      IT_TEST_USER_ID: ${IT_TEST_USER_ID:-1}
      IT_HLS_SIGNED_URLS: ${IT_HLS_SIGNED_URLS:-}
      IT_HLS_URLTOKEN_TTL_SECONDS: ${IT_HLS_URLTOKEN_TTL_SECONDS:-${EBAP_HLS_URLTOKEN_TTL_SECONDS:-120}}
      IT_HLS_ASSET_TOKEN_ONLY: ${IT_HLS_ASSET_TOKEN_ONLY:-${EBAP_HLS_SIGNED_URLS_ASSET_TOKEN_ONLY:-}}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      api-gateway:
        condition: service_healthy
      ebap-hls-adapter:
        condition: service_healthy
      party-state-service:
        condition: service_healthy
      party-gateway-service:
        condition: service_healthy
    networks:
      - music-network
    command: [ "bun", "test" ]

  # Database Service (INTERNAL ONLY - access via api-gateway)
  database-service:
    build:
      context: ./backend/database-service
      dockerfile: Dockerfile
    container_name: music-database-service
    # Security: Internal service, no public ports
    expose:
      - "3003"
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${DATABASE_DB_MAX_CONNECTIONS:-50}
      DB_MIN_CONNECTIONS: ${DATABASE_DB_MIN_CONNECTIONS:-5}
      DB_IDLE_TIMEOUT_MS: ${DATABASE_DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DATABASE_DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DATABASE_DB_STATEMENT_TIMEOUT_MS:-30000}
      LOAD_TEST_MODE: ${LOAD_TEST_MODE:-false}
      DATABASE_SERVICE_RATE_LIMIT_MULTIPLIER: ${DATABASE_SERVICE_RATE_LIMIT_MULTIPLIER:-}
      LOAD_TEST_RATE_LIMIT_MULTIPLIER: ${LOAD_TEST_RATE_LIMIT_MULTIPLIER:-}
      SERVICE_JWT_PRIVATE_KEY_B64: ${SERVICE_JWT_PRIVATE_KEY_B64}
      SERVICE_JWT_PUBLIC_KEY_B64: ${SERVICE_JWT_PUBLIC_KEY_B64}
      SERVICE_JWT_ISSUER: ${SERVICE_JWT_ISSUER:-database-service}
      SERVICE_JWT_AUDIENCE: ${SERVICE_JWT_AUDIENCE:-database-service}
      SERVICE_KEY_API_GATEWAY: ${SERVICE_KEY_API_GATEWAY}
      SERVICE_KEY_ARTIST_API_GATEWAY: ${SERVICE_KEY_ARTIST_API_GATEWAY}
      SERVICE_KEY_AUTH_SERVICE: ${SERVICE_KEY_AUTH_SERVICE}
      SERVICE_KEY_UPLOAD_SERVICE: ${SERVICE_KEY_UPLOAD_SERVICE}
      SERVICE_KEY_TRACK_PROCESSOR: ${SERVICE_KEY_TRACK_PROCESSOR}
      SERVICE_KEY_AUDIO_FEATURES_WORKER: ${SERVICE_KEY_AUDIO_FEATURES_WORKER}
      SERVICE_KEY_EBAP_HLS_ADAPTER: ${SERVICE_KEY_EBAP_HLS_ADAPTER}
      JWT_EXPIRES_IN: 24h
      ALLOWED_SERVICES: ${ALLOWED_SERVICES:-auth-service,upload-service,api-gateway,artist-api-gateway,track-processor,recommendations-service,audio-features-worker,ebap-hls-adapter}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  search-service:
    build:
      context: ./backend/search-service
      dockerfile: Dockerfile
    container_name: music-search-service
    expose:
      - "3062"
    environment:
      PORT: 3062
      NODE_ENV: ${NODE_ENV}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      MEILI_URL: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY?MEILI_MASTER_KEY is required (>=16 chars)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNECTIONS: ${SEARCH_DB_MAX_CONNECTIONS:-10}
      DB_PREPARE: ${SEARCH_DB_PREPARE:-true}
      SEARCH_REQUEST_TIMEOUT_MS: ${SEARCH_REQUEST_TIMEOUT_MS:-2500}
      SEARCH_PUBLIC_MAX_LIMIT: ${SEARCH_PUBLIC_MAX_LIMIT:-20}
      SEARCH_AUTHED_MAX_LIMIT: ${SEARCH_AUTHED_MAX_LIMIT:-50}
      SEARCH_INDEXER_ENABLED: ${SEARCH_INDEXER_ENABLED:-true}
      SEARCH_SETUP_INDEXES: ${SEARCH_SETUP_INDEXES:-true}
      SEARCH_BACKFILL_ON_START: ${SEARCH_BACKFILL_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3062/health >/dev/null 2>&1 || wget -qO- http://localhost:3062/health >/dev/null 2>&1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  meilisearch:
    image: getmeili/meilisearch:v1.7.6
    container_name: music-meilisearch
    expose:
      - "7700"
    environment:
      MEILI_ENV: ${NODE_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY?MEILI_MASTER_KEY is required (>=16 chars)}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:7700/health >/dev/null 2>&1 || wget -qO- http://localhost:7700/health >/dev/null 2>&1" ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # EBAP HLS Adapter (INTERNAL ONLY - access via api-gateway)
  # ==========================================================================
  ebap-hls-adapter:
    build:
      context: ./backend/ebap-hls-adapter
      dockerfile: Dockerfile
    container_name: music-ebap-hls-adapter
    expose:
      - "3095"
    ports:
      - "127.0.0.1:3095:3095"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      PORT: 3095
      NODE_ENV: ${NODE_ENV}
      LYRICS_SERVICE_URL: http://lyrics-service:3010
      SERVICE_TOKEN_ENDPOINT: http://database-service:3003/auth/service-token
      SERVICE_TOKEN_SERVICE_NAME: ebap-hls-adapter
      SERVICE_TOKEN_SERVICE_KEY: ${SERVICE_KEY_EBAP_HLS_ADAPTER:-}
      SYSTEM_ROOT_SECRET: ${SYSTEM_ROOT_SECRET}
      EBAP_TRACK_KEY_MASTER_SECRET: ${EBAP_TRACK_KEY_MASTER_SECRET:-}
      EBAP_TRACK_KEY_MASTER_SECRETS: ${EBAP_TRACK_KEY_MASTER_SECRETS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.earflow.ru}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EBAP_HLS_COOKIE_SECRET: ${EBAP_HLS_COOKIE_SECRET}
      EBAP_HLS_COOKIE_SECRETS: ${EBAP_HLS_COOKIE_SECRETS:-}
      EBAP_HLS_COOKIE_TTL_SECONDS: ${EBAP_HLS_COOKIE_TTL_SECONDS:-900}
      EBAP_HLS_SIGNED_URLS: ${EBAP_HLS_SIGNED_URLS:-}
      EBAP_HLS_URLTOKEN_SECRET: ${EBAP_HLS_URLTOKEN_SECRET:-}
      EBAP_HLS_URLTOKEN_SECRETS: ${EBAP_HLS_URLTOKEN_SECRETS:-}
      EBAP_HLS_URLTOKEN_TTL_SECONDS: ${EBAP_HLS_URLTOKEN_TTL_SECONDS:-120}
      EBAP_HLS_SIGNED_URLS_ASSET_TOKEN_ONLY: ${EBAP_HLS_SIGNED_URLS_ASSET_TOKEN_ONLY:-}
      EBAP_HLS_SIGNED_URLS_PLAYLIST_TOKEN_ONLY: ${EBAP_HLS_SIGNED_URLS_PLAYLIST_TOKEN_ONLY:-}
      EBAP_HLS_SIGNED_URLS_PLAYLIST_REQUIRE_COOKIE: ${EBAP_HLS_SIGNED_URLS_PLAYLIST_REQUIRE_COOKIE:-}
      EBAP_HLS_SESSION_RL_PER_WINDOW: ${EBAP_HLS_SESSION_RL_PER_WINDOW:-30}
      EBAP_HLS_SESSION_RL_WINDOW_SECONDS: ${EBAP_HLS_SESSION_RL_WINDOW_SECONDS:-60}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      EBAP_MINIO_BUCKET: ${EBAP_MINIO_BUCKET:-ebap-cache}
      EBAP_MANIFEST_PREFIX: ${EBAP_MANIFEST_PREFIX:-manifests/}
      EBAP_HLS_MINIO_BUCKET: ${EBAP_HLS_MINIO_BUCKET:-ebap-hls}
      EBAP_HLS_PREFIX: ${EBAP_HLS_PREFIX:-hls/v1/}
      EBAP_S3_TIMEOUT_MS: ${EBAP_S3_TIMEOUT_MS:-5000}
      EBAP_MAX_MANIFEST_BYTES: ${EBAP_MAX_MANIFEST_BYTES:-262144}
      EBAP_MAX_CHUNK_BYTES: ${EBAP_MAX_CHUNK_BYTES:-1048576}
      EBAP_MAX_INFLIGHT_BYTES: ${EBAP_MAX_INFLIGHT_BYTES:-8388608}
      EBAP_HLS_MAX_TRANSCODE_JOBS: ${EBAP_HLS_MAX_TRANSCODE_JOBS:-1}
      EBAP_HLS_LOCK_TTL_MS: ${EBAP_HLS_LOCK_TTL_MS:-600000}
      EBAP_HLS_WAIT_READY_MS: ${EBAP_HLS_WAIT_READY_MS:-30000}
      EBAP_HLS_SEGMENT_SECONDS: ${EBAP_HLS_SEGMENT_SECONDS:-4}
      FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      EBAP_HLS_AAC_BITRATE_K: ${EBAP_HLS_AAC_BITRATE_K:-128}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=2048M
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3095/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # Direct Stream Service (Progressive, signed URL, Range)
  # ==========================================================================
  direct-stream-service:
    build:
      context: ./backend/direct-stream-service
      dockerfile: Dockerfile
    container_name: music-direct-stream-service
    expose:
      - "3096"
    environment:
      PORT: 3096
      NODE_ENV: ${NODE_ENV:-production}
      SYSTEM_ROOT_SECRET: ${SYSTEM_ROOT_SECRET}
      DIRECT_STREAM_URLTOKEN_SECRET: ${DIRECT_STREAM_URLTOKEN_SECRET:-}
      DIRECT_STREAM_URLTOKEN_SECRETS: ${DIRECT_STREAM_URLTOKEN_SECRETS:-}
      DIRECT_STREAM_URLTOKEN_TTL_SECONDS: ${DIRECT_STREAM_URLTOKEN_TTL_SECONDS:-900}
      DIRECT_STREAM_PUBLIC_ORIGIN: ${DIRECT_STREAM_PUBLIC_ORIGIN:-https://strmhaha.earflow.ru}
      DIRECT_STREAM_COOKIE_NAME: ${DIRECT_STREAM_COOKIE_NAME:-mp_stream}
      DIRECT_STREAM_COOKIE_TTL_SECONDS: ${DIRECT_STREAM_COOKIE_TTL_SECONDS:-1800}
      DIRECT_STREAM_COOKIE_DOMAIN: ${DIRECT_STREAM_COOKIE_DOMAIN:-.earflow.ru}
      LIBRARY_USER_ID: ${LIBRARY_USER_ID:-1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${DIRECT_STREAM_DB_MAX_CONNECTIONS:-10}
      DB_IDLE_TIMEOUT_SECONDS: ${DIRECT_STREAM_DB_IDLE_TIMEOUT_SECONDS:-30}
      DB_CONNECTION_TIMEOUT_SECONDS: ${DIRECT_STREAM_DB_CONNECTION_TIMEOUT_SECONDS:-5}
      DB_PREPARE: ${DIRECT_STREAM_DB_PREPARE:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      EBAP_MINIO_BUCKET: ${EBAP_MINIO_BUCKET:-ebap-cache}
      EBAP_MANIFEST_PREFIX: ${EBAP_MANIFEST_PREFIX:-manifests/}
      EBAP_HLS_MINIO_BUCKET: ${EBAP_HLS_MINIO_BUCKET:-ebap-hls}
      EBAP_HLS_PREFIX: ${EBAP_HLS_PREFIX:-hls/v1/}
      EBAP_S3_TIMEOUT_MS: ${EBAP_S3_TIMEOUT_MS:-5000}
      EBAP_MAX_MANIFEST_BYTES: ${EBAP_MAX_MANIFEST_BYTES:-262144}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DIRECT_STREAM_SESSION_CACHE_TTL_SECONDS: ${DIRECT_STREAM_SESSION_CACHE_TTL_SECONDS:-300}
      DIRECT_STREAM_PLAYBACK_TOKEN_TTL_SECONDS: ${DIRECT_STREAM_PLAYBACK_TOKEN_TTL_SECONDS:-90}
      DIRECT_STREAM_PLAYBACK_SESSION_TTL_SECONDS: ${DIRECT_STREAM_PLAYBACK_SESSION_TTL_SECONDS:-900}
      DIRECT_STREAM_PLAYBACK_MAX_ACTIVE_SESSIONS_PER_USER: ${DIRECT_STREAM_PLAYBACK_MAX_ACTIVE_SESSIONS_PER_USER:-4}
      DIRECT_STREAM_PLAYBACK_MEDIA_RL_WINDOW_SECONDS: ${DIRECT_STREAM_PLAYBACK_MEDIA_RL_WINDOW_SECONDS:-60}
      DIRECT_STREAM_PLAYBACK_MEDIA_RL_MAX_REQUESTS: ${DIRECT_STREAM_PLAYBACK_MEDIA_RL_MAX_REQUESTS:-900}
      DIRECT_STREAM_HLS_SEGMENT_CACHE_ENABLED: ${DIRECT_STREAM_HLS_SEGMENT_CACHE_ENABLED:-true}
      DIRECT_STREAM_HLS_SEGMENT_CACHE_TTL_SECONDS: ${DIRECT_STREAM_HLS_SEGMENT_CACHE_TTL_SECONDS:-604800}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3096/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Auth Service (INTERNAL ONLY - access via api-gateway)
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: music-auth-service
    # Security: Internal service, no public ports
    expose:
      - "3001"
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-earflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-earflow-api}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-365d}
      ACCESS_JWT_EXPIRES_IN: ${ACCESS_JWT_EXPIRES_IN:-15m}
      REFRESH_JWT_EXPIRES_IN: ${REFRESH_JWT_EXPIRES_IN:-365d}
      DB_SERVICE_URL: http://database-service:3003
      SERVICE_KEY_AUTH_SERVICE: ${SERVICE_KEY_AUTH_SERVICE}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PROFILE_CACHE_TTL_SECONDS: ${PROFILE_CACHE_TTL_SECONDS:-600}
    depends_on:
      database-service:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # auth-core (Go) — drop-in replacement for Node auth-service identity endpoints.
  # AUTH_SERVICE_URL on api-gateway/artist-api-gateway flips to this service after
  # e2e validation; Node auth-service stays as auth_legacy for MFA routes.
  auth-core:
    build:
      context: ./backend/auth-core
      dockerfile: Dockerfile
    container_name: music-auth-core
    # Security: Internal service, no public ports
    expose:
      - "3001"
    environment:
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-earflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-earflow-api}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ACCESS_JWT_EXPIRES_IN: ${ACCESS_JWT_EXPIRES_IN:-15m}
      REFRESH_JWT_EXPIRES_IN: ${REFRESH_JWT_EXPIRES_IN:-365d}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${AUTH_CORE_DB_MAX_CONNECTIONS:-30}
      DB_MIN_CONNECTIONS: ${AUTH_CORE_DB_MIN_CONNECTIONS:-4}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PROFILE_CACHE_TTL_SECONDS: ${PROFILE_CACHE_TTL_SECONDS:-600}
      AUTH_DECOY_SALT: ${AUTH_DECOY_SALT:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Upload Service (INTERNAL ONLY - access via api-gateway)
  upload-service:
    build:
      context: ./backend/upload-service
      dockerfile: Dockerfile
    container_name: music-upload-service
    # Security: Internal service, no public ports
    expose:
      - "3002"
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://earflow.ru}
      AUTH_SERVICE_URL: http://auth-service:3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${UPLOAD_DB_MAX_CONNECTIONS:-30}
      DB_MIN_CONNECTIONS: ${UPLOAD_DB_MIN_CONNECTIONS:-5}
      DB_IDLE_TIMEOUT_MS: ${UPLOAD_DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${UPLOAD_DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${UPLOAD_DB_STATEMENT_TIMEOUT_MS:-30000}
      SERVICE_JWT_PUBLIC_KEY_B64: ${SERVICE_JWT_PUBLIC_KEY_B64}
      SERVICE_JWT_ISSUER: ${SERVICE_JWT_ISSUER:-database-service}
      SERVICE_JWT_AUDIENCE_UPLOAD: ${SERVICE_JWT_AUDIENCE_UPLOAD:-upload-service}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
      MEDIA_AUTH_DEBUG: ${MEDIA_AUTH_DEBUG:-}
      LOAD_TEST_MODE: ${LOAD_TEST_MODE:-false}
      UPLOAD_RATE_LIMIT_MULTIPLIER: ${UPLOAD_RATE_LIMIT_MULTIPLIER:-}
      LOAD_TEST_RATE_LIMIT_MULTIPLIER: ${LOAD_TEST_RATE_LIMIT_MULTIPLIER:-}
      # MinIO Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS}
      STORAGE_MODE: ${STORAGE_MODE:-minio}
    volumes:
      - upload-files:/app/uploads
      # Mount music library read-only to avoid duplication
      - "${MUSIC_SOURCE_DIR:-./data/music}:/app/uploads/library:ro"
    depends_on:
      database-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  artist-service:
    build:
      context: ./backend/artist-service
      dockerfile: Dockerfile
    container_name: music-artist-service
    expose:
      - "3040"
    environment:
      PORT: 3040
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVICE_URL: http://auth-service:3001
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${ARTIST_DB_MAX_CONNECTIONS:-20}
      DB_MIN_CONNECTIONS: ${ARTIST_DB_MIN_CONNECTIONS:-3}
      DB_IDLE_TIMEOUT_MS: ${ARTIST_DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${ARTIST_DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${ARTIST_DB_STATEMENT_TIMEOUT_MS:-30000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS},https://artists.earflow.ru
      ARTIST_CLAIM_AUTO_REVIEW_ENABLED: ${ARTIST_CLAIM_AUTO_REVIEW_ENABLED:-true}
      ARTIST_CLAIM_AUTO_APPROVE_ENABLED: ${ARTIST_CLAIM_AUTO_APPROVE_ENABLED:-true}
      ARTIST_CLAIM_MIN_NOTE_LENGTH: ${ARTIST_CLAIM_MIN_NOTE_LENGTH:-20}
      ARTIST_CLAIM_AUTO_APPROVE_MIN_TRUSTED_LINKS: ${ARTIST_CLAIM_AUTO_APPROVE_MIN_TRUSTED_LINKS:-2}
      ARTIST_CLAIM_MANUAL_REVIEW_MIN_TRACKS: ${ARTIST_CLAIM_MANUAL_REVIEW_MIN_TRACKS:-5}
      ARTIST_CLAIM_MANUAL_REVIEW_MIN_PLAYS: ${ARTIST_CLAIM_MANUAL_REVIEW_MIN_PLAYS:-10000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN?INTERNAL_SERVICE_TOKEN is required and must be at least 32 chars}
    depends_on:
      database-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3040/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  artist-portal-service:
    build:
      context: ./backend/artist-portal-service
      dockerfile: Dockerfile
    container_name: music-artist-portal-service
    expose:
      - "3085"
    environment:
      PORT: 3085
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      ARTIST_SERVICE_URL: http://artist-service:3040
      AUTH_SERVICE_URL: http://auth-service:3001
      UPLOAD_SERVICE_URL: http://upload-service:3002
      ALLOWED_ORIGINS: https://artists.earflow.ru
      ARTIST_PORTAL_DISABLE_TRACK_UPLOAD_STEP_UP: ${ARTIST_PORTAL_DISABLE_TRACK_UPLOAD_STEP_UP:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN?INTERNAL_SERVICE_TOKEN is required and must be at least 32 chars}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
    depends_on:
      artist-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3085/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Security Service (Go) — account security hot-path endpoints.
  # Handles: /security/overview, /password/change, /password/strength,
  # /telegram/unlink, /sessions, /sessions/revoke-others, /2fa/recovery/regenerate.
  # Reads/writes directly to Postgres (users) and Redis (sessions, step-up, rate-limit)
  # so the same state shared with auth-service is single-writer per domain op.
  # ==========================================================================
  security-service:
    build:
      context: ./backend/security-service
      dockerfile: Dockerfile
    container_name: music-security-service
    expose:
      - "3074"
    environment:
      PORT: 3074
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-earflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-earflow-api}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      DB_MAX_CONNECTIONS: ${SECURITY_DB_MAX_CONNECTIONS:-20}
      DB_MIN_CONNECTIONS: ${SECURITY_DB_MIN_CONNECTIONS:-2}
      DB_PREPARE: ${SECURITY_DB_PREPARE:-true}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      HTTP_HANDLER_TIMEOUT_MS: ${SECURITY_HANDLER_TIMEOUT_MS:-10000}
      SECURITY_STEP_UP_TTL_SECONDS: ${SECURITY_STEP_UP_TTL_SECONDS:-300}
      SECURITY_PASSWORD_WINDOW_SECONDS: ${SECURITY_PASSWORD_WINDOW_SECONDS:-60}
      SECURITY_PASSWORD_MAX_ATTEMPTS: ${SECURITY_PASSWORD_MAX_ATTEMPTS:-5}
      SECURITY_STRENGTH_WINDOW_SECONDS: ${SECURITY_STRENGTH_WINDOW_SECONDS:-60}
      SECURITY_STRENGTH_MAX: ${SECURITY_STRENGTH_MAX:-60}
      SECURITY_MAX_SESSIONS: ${SECURITY_MAX_SESSIONS:-40}
      SECURITY_PASSWORD_MIN_LENGTH: ${SECURITY_PASSWORD_MIN_LENGTH:-8}
      SERVICE_KEY_API_GATEWAY: ${SERVICE_KEY_API_GATEWAY}
      AUTH_PG_SOT_MODE: ${AUTH_PG_SOT_MODE:-off}
      SECURITY_PASSWORD_MAX_LENGTH: ${SECURITY_PASSWORD_MAX_LENGTH:-256}
      SECURITY_PBKDF_ITERATIONS: ${SECURITY_PBKDF_ITERATIONS:-600000}
      SECURITY_PBKDF_ITERATIONS_LEGACY: ${SECURITY_PBKDF_ITERATIONS_LEGACY:-100000}
      SECURITY_PBKDF_KEY_LENGTH: ${SECURITY_PBKDF_KEY_LENGTH:-64}
      SECURITY_ENC_PBKDF_ITERATIONS: ${SECURITY_ENC_PBKDF_ITERATIONS:-600000}
      SECURITY_ENC_KEY_LENGTH: ${SECURITY_ENC_KEY_LENGTH:-32}
    depends_on:
      postgres:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32M
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3074/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  artist-api-gateway:
    build:
      context: ./backend/go-api-gateway
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
    container_name: music-artist-api-gateway
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV}
      APP_VERSION: ${APP_VERSION:-local}
      GIT_SHA: ${GIT_SHA:-local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-earflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-earflow-api}
      DEBUG_AUTH: ${DEBUG_AUTH:-0}
      TRUST_PROXY: "1"

      CLIENT_ERROR_LOG_ENABLED: ${CLIENT_ERROR_LOG_ENABLED:-false}

      COOKIE_DOMAIN: ".artists.earflow.ru"
      COOKIE_SAMESITE: "none"
      COOKIE_SECURE: "true"
      COOKIE_AUTH_NAME: "mp_auth_artists"
      COOKIE_REFRESH_NAME: "mp_refresh_artists"
      COOKIE_SID_NAME: "mp_sid_artists"
      COOKIE_CSRF_NAME: "mp_csrf_artists"
      SESSION_KEY_PREFIX: "mp:artist:sess:"
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}

      GATEWAY_SERVICE_NAME: "artist-api-gateway"
      SERVICE_KEY_API_GATEWAY: ${SERVICE_KEY_ARTIST_API_GATEWAY}
      GATEWAY_CONFIG_PATH: /app/gateway.artist.yaml

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}

      AUTH_SERVICE_URL: http://auth-service:3001
      DATABASE_SERVICE_URL: http://database-service:3003
      ARTIST_PORTAL_SERVICE_URL: http://artist-portal-service:3085
      SECURITY_SERVICE_URL: http://security-service:3074
      ALLOWED_ORIGINS: https://artists.earflow.ru

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_AUTH_HOST: redis-auth
      REDIS_AUTH_PORT: 6379
      REDIS_AUTH_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_RL_HOST: redis
      REDIS_RL_PORT: 6379
      REDIS_RL_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-31536000}
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      database-service:
        condition: service_healthy
      artist-portal-service:
        condition: service_healthy
      security-service:
        condition: service_healthy
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

