      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${LYRICS_DB_MAX_CONNECTIONS:-20}
      DB_MIN_CONNECTIONS: ${LYRICS_DB_MIN_CONNECTIONS:-0}
