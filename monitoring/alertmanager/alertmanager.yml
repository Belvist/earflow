global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by:
    - alertname
    - severity
    - job
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: telegram
      matchers:
        - severity="critical"
      repeat_interval: 30m
    - receiver: telegram
      matchers:
        - severity="warning"
      repeat_interval: 2h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
      - job

receivers:
  - name: telegram
    telegram_configs:
      - send_resolved: true
        bot_token_file: /tmp/alertmanager/telegram_bot_token
        chat_id_file: /tmp/alertmanager/telegram_chat_id
        parse_mode: ""
        message: '{{ template "telegram.earflow.message" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
