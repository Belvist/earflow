groups:
  - name: earflow.platform
    rules:
      - alert: EarflowScrapeTargetDown
        expr: up{job!~"blackbox-http|alertmanager|pgbouncer"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus не может собрать метрики с цели"
          description: "Цель job={{ $labels.job }} instance={{ $labels.instance }} недоступна для scrape больше 2 минут."

      - alert: EarflowHttpHealthProbeDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP health-check не проходит"
          description: "{{ $labels.instance }} не проходит blackbox health-check больше 2 минут."

      - alert: EarflowHostDiskUsageHigh
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|aufs"} / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|aufs"})) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокое заполнение диска на сервере"
          description: "На {{ $labels.instance }} mount={{ $labels.mountpoint }} диск заполнен больше чем на 80% уже более 10 минут."

      - alert: EarflowHostMemoryUsageHigh
        expr: 100 * (1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокое потребление памяти на сервере"
          description: "На {{ $labels.instance }} память занята больше чем на 85% уже более 10 минут."

      - alert: EarflowContainerRestarting
        expr: sum by (container_label_com_docker_compose_service) (changes(container_start_time_seconds{container_label_com_docker_compose_service!=""}[15m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер часто перезапускается"
          description: "Compose-сервис {{ $labels.container_label_com_docker_compose_service }} перезапускался больше одного раза за последние 15 минут."

  - name: earflow.gateway
    rules:
      - alert: EarflowGatewayHigh5xxRate
        expr: sum(rate(gateway_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(gateway_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: critical
          service: api-gateway
        annotations:
          summary: "У gateway высокий процент 5xx"
          description: "Доля 5xx на API gateway выше 1% больше 5 минут."

      - alert: EarflowGatewayP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(gateway_http_request_duration_seconds_bucket[5m])) by (le)) > 0.75
        for: 5m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "У gateway высокая p95 latency"
          description: "p95 latency на API gateway выше 750 ms больше 5 минут."

  - name: earflow.recommendations
    rules:
      - alert: EarflowRecommendationInfiniteFeedSpike
        expr: sum(rate(reco_http_requests_total{route=~"^(/api/recommendations)?/infinite$"}[5m])) > 20
        for: 10m
        labels:
          severity: warning
          service: recommendations-service
        annotations:
          summary: "Всплеск запросов infinite-рекомендаций"
          description: "POST /api/recommendations/infinite выше 20 запросов/сек больше 10 минут. Проверь frontend loop, автодозаполнение очереди, кеш и rate limit."

  - name: earflow.postgres
    rules:
      - alert: EarflowPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count{datname!~"template.*"}) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "В Postgres много подключений"
          description: "Количество подключений Postgres выше 80% от max_connections больше 10 минут."

  - name: earflow.pgbouncer
    rules:
      - alert: EarflowPgBouncerClientsWaiting
        expr: sum(pgbouncer_pools_client_waiting_connections) > 0
        for: 2m
        labels:
          severity: critical
          service: pgbouncer
        annotations:
          summary: "Клиенты PgBouncer ждут свободное подключение"
          description: "В PgBouncer есть клиенты в ожидании server connection больше 2 минут. Проверь latency БД, размеры pool и медленные запросы."

      - alert: EarflowPgBouncerClientMaxWaitHigh
        expr: max(pgbouncer_pools_client_maxwait_seconds) > 5
        for: 2m
        labels:
          severity: critical
          service: pgbouncer
        annotations:
          summary: "Высокое время ожидания в PgBouncer"
          description: "Максимальное ожидание клиента PgBouncer выше 5 секунд больше 2 минут."

  - name: earflow.redis
    rules:
      - alert: EarflowRedisMemoryUsageHigh
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis почти исчерпал память"
          description: "Redis на {{ $labels.instance }} использует больше 80% памяти уже более 10 минут."

      - alert: EarflowRedisEvictions
        expr: increase(redis_evicted_keys_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis начал вытеснять ключи"
          description: "Redis на {{ $labels.instance }} вытеснял ключи за последние 5 минут. Проверь память и eviction policy."
