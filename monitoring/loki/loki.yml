auth_enabled: false

server:
  http_listen_port: 3100

frontend:
  max_outstanding_per_tenant: 8192

querier:
  max_concurrent: 16

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  volume_enabled: true
  max_entries_limit_per_query: 5000
  max_query_length: 24h
  split_queries_by_interval: 24h

query_range:

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules
