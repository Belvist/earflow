server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-json-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          stream: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    relabel_configs:
      - source_labels:
          - __path__
        regex: "/var/lib/docker/containers/([0-9a-f]{64})/.*"
        target_label: container_id
        replacement: "$1"
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            name: name
            event: event
            msg: msg
            level: level
      - template:
          source: event
          template: '{{ if .Value }}{{ .Value }}{{ else if .Extracted.msg }}{{ .Extracted.msg }}{{ else }}log{{ end }}'
      - template:
          source: level
          template: '{{ if .Value }}{{ .Value }}{{ else }}info{{ end }}'
      - labeldrop:
          - __error__
          - __error_details__
      - labels:
          event:
          level:
