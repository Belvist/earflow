name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-api-gateway:
    name: go-api-gateway (go test + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/go-api-gateway/go.sum

      - name: Test
        working-directory: backend/go-api-gateway
        run: go test ./...

      - name: Test PoP e2e harness (build tag)
        working-directory: backend/go-api-gateway
        run: go test -tags pop_e2e_harness ./internal/auth/ -run TestPopE2E -count=1

      - name: Vet
        working-directory: backend/go-api-gateway
        run: go vet ./...

  device-sync-service:
    name: device-sync-service (go test + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/device-sync-service/go.sum

      - name: Test
        working-directory: backend/device-sync-service
        run: go test ./...

      - name: Vet
        working-directory: backend/device-sync-service
        run: go vet ./...

  go-services:
    name: ${{ matrix.service }} (go test + vet)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ranking-service
          - reco-feedback-worker
          - search-service
          - security-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Test
        working-directory: backend/${{ matrix.service }}
        run: go test ./...

      - name: Vet
        working-directory: backend/${{ matrix.service }}
        run: go vet ./...

  service-audit:
    name: service inventory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit service layout
        run: node scripts/service-audit.js --strict

      - name: Enforce gesture policy
        run: node scripts/check-gesture-policy.js

      - name: Auth prod bypass guard (PEND-SEC-000)
        run: node scripts/validate-auth-prod-guard.js

      - name: Validate compose config
        run: docker compose config --quiet

  party-go:
    name: party-go (go test + vet + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/party-go/go.sum

      - name: Test
        working-directory: backend/party-go
        run: go test ./...

      - name: Vet
        working-directory: backend/party-go
        run: go vet ./...

      - name: Build
        working-directory: backend/party-go
        run: go build -trimpath ./cmd/party-state ./cmd/party-gateway

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

  frontend-e2e-player:
    name: frontend (playwright — real swipes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: E2E player gestures (pointer swipes + track-change asserts)
        working-directory: frontend
        env:
          CI: "true"
          E2E_STRESS_ACTIONS: "30"
        run: npm run test:e2e:ci-player

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-player-e2e
          path: |
            frontend/e2e/report
            frontend/test-results
          retention-days: 7
