# ==============================================================================
# SECRETS TEMPLATE - НЕ КОММИТЬТЕ РЕАЛЬНЫЕ ЗНАЧЕНИЯ!
# ==============================================================================
# 
# ИНСТРУКЦИЯ:
# 1. Скопируйте этот файл: cp secrets.yaml secrets.local.yaml
# 2. Замените <PLACEHOLDER> на реальные значения
# 3. Примените: kubectl apply -f secrets.local.yaml
#
# Генерация безопасных секретов:
#   openssl rand -hex 64  # Для JWT_SECRET, SESSION_SECRET
#   openssl rand -hex 32  # Для ENCRYPTION_KEY, SERVICE_SECRET
#   openssl rand -base64 24  # Для паролей
#
# ВАЖНО: secrets.local.yaml добавлен в .gitignore!
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: music-secrets
  namespace: music-platform
type: Opaque
stringData:
  # ⚠️ ЗАМЕНИТЕ ВСЕ PLACEHOLDER НА РЕАЛЬНЫЕ ЗНАЧЕНИЯ!
  JWT_SECRET: "<GENERATE_WITH: openssl rand -hex 64>"
  SERVICE_SECRET: "<GENERATE_WITH: openssl rand -hex 32>"
  ENCRYPTION_KEY: "<GENERATE_WITH: openssl rand -hex 32>"
  DB_PASSWORD: "<GENERATE_WITH: openssl rand -base64 24>"
  REDIS_PASSWORD: "<GENERATE_WITH: openssl rand -hex 64>"
  MINIO_ROOT_USER: "<YOUR_MINIO_USER>"
  MINIO_ROOT_PASSWORD: "<GENERATE_WITH: openssl rand -base64 24>"
  RECO_SESSION_SECRET: "<GENERATE_WITH: openssl rand -hex 32>"
