apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: music-platform
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: music-platform
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4.2-alpine3.21
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-secrets
                  key: REDIS_PASSWORD
          command: ["sh", "-c"]
          args:
            - >-
              if [ -n "$REDIS_PASSWORD" ]; then
                exec redis-server
                --appendonly yes
                --appendfsync everysec
                --maxmemory 256mb
                --maxmemory-policy allkeys-lru
                --tcp-keepalive 300
                --timeout 0
                --requirepass "$REDIS_PASSWORD";
              else
                exec redis-server
                --appendonly yes
                --appendfsync everysec
                --maxmemory 256mb
                --maxmemory-policy allkeys-lru
                --tcp-keepalive 300
                --timeout 0;
              fi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
              ephemeral-storage: "64Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-auth
  namespace: music-platform
spec:
  selector:
    app: redis-auth
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-auth
  namespace: music-platform
spec:
  serviceName: redis-auth
  replicas: 1
  selector:
    matchLabels:
      app: redis-auth
  template:
    metadata:
