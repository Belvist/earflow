            - >-
              if [ -n "$REDIS_PASSWORD" ]; then
                exec redis-server
                --appendonly yes
                --appendfsync everysec
                --maxmemory 512mb
                --maxmemory-policy noeviction
                --tcp-keepalive 300
                --timeout 0
                --requirepass "$REDIS_PASSWORD";
              else
                exec redis-server
                --appendonly yes
                --appendfsync everysec
                --maxmemory 512mb
                --maxmemory-policy noeviction
                --tcp-keepalive 300
                --timeout 0;
              fi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
              ephemeral-storage: "64Mi"
            limits:
              memory: "768Mi"
              cpu: "500m"
              ephemeral-storage: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
